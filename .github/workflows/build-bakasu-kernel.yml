name: Build ZoroKernel

on:
  push:
    branches:
      - lineage-24.0_underclock_bakasu
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zorokernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build POCO F7 Android 17 kernels
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      BAKASU_COMMIT: 516d3e87fbc986ccefdde2c2765f1700612441a9
      ANYKERNEL3_COMMIT: 41f04bdb4ee30a44e429c2c1131d5e8bb32b15f1
      SUSFS_VERSION: v2.3.0
      SUSFS_COMMIT: c7f670f57b7d43d75066b6657f8aee9cdf580d96

    steps:
      - name: Check out kernel source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libelf-dev \
            libssl-dev make pahole python3 python3-pip rsync zip

      - name: Install LLVM toolchain
        run: |
          sudo apt-get install -y clang lld llvm
          clang --version

      - name: Fetch and integrate pinned BakaSU
        run: |
          rm -rf KernelSU
          git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          git -C KernelSU fetch --depth=1 origin "$BAKASU_COMMIT"
          sh KernelSU/kernel/setup.sh "$BAKASU_COMMIT"
          test "$(git -C KernelSU rev-parse HEAD)" = "$BAKASU_COMMIT"
          test -L drivers/kernelsu

      - name: Configure kernel
        run: |
          mkdir -p out
          scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/gki_defconfig \
            arch/arm64/configs/vendor/pineapple_perf.config
          scripts/config --file out/.config \
            --enable KSU \
            --enable KSU_SUSFS \
            --disable KSU_TRACEPOINT_HOOK \
            --disable KSU_MANUAL_HOOK \
            --enable KSU_SUSFS_SUS_PATH \
            --enable KSU_SUSFS_SUS_MOUNT \
            --enable KSU_SUSFS_SUS_KSTAT \
            --enable KSU_SUSFS_SPOOF_UNAME \
            --enable KSU_SUSFS_ENABLE_LOG \
            --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            --enable KSU_SUSFS_OPEN_REDIRECT \
            --enable KSU_SUSFS_SUS_MAP
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KSU_SUSFS=y$' out/.config
          grep -q '^# CONFIG_KSU_TRACEPOINT_HOOK is not set$' out/.config
          grep -q '^# CONFIG_KSU_MANUAL_HOOK is not set$' out/.config
          for symbol in KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_ENABLE_LOG KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_OPEN_REDIRECT KSU_SUSFS_SUS_MAP; do
            grep -q "^CONFIG_${symbol}=y$" out/.config
          done
          grep -q '^CONFIG_ARCH_PINEAPPLE=y$' out/.config
          grep -q '^CONFIG_DEVFREQ_GOV_QCOM_ADRENO_TZ=m$' out/.config
          grep -q '^CONFIG_DEVFREQ_GOV_QCOM_GPUBW_MON=m$' out/.config
          grep -q '^CONFIG_SCHED_WALT=m$' out/.config
          grep -E '^(CONFIG_KSU|CONFIG_KSU_)' out/.config

      - name: Build kernel
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 Image
          test -s out/arch/arm64/boot/Image

      - name: Package recovery ZIPs
        run: |
          set -euo pipefail
          mkdir -p artifacts "$RUNNER_TEMP/ak3-src"
          git clone --no-checkout https://github.com/osm0sis/AnyKernel3.git "$RUNNER_TEMP/ak3-src"
          git -C "$RUNNER_TEMP/ak3-src" fetch --depth=1 origin "$ANYKERNEL3_COMMIT"
          git -C "$RUNNER_TEMP/ak3-src" checkout --detach "$ANYKERNEL3_COMMIT"
          test "$(git -C "$RUNNER_TEMP/ak3-src" rev-parse HEAD)" = "$ANYKERNEL3_COMMIT"

          for variant in smooth performance; do
            stage="$RUNNER_TEMP/ZoroKernel-$variant"
            rm -rf "$stage"
            mkdir -p "$stage"
            git -C "$RUNNER_TEMP/ak3-src" archive "$ANYKERNEL3_COMMIT" | tar -x -C "$stage"
            rm -rf "$stage/.git" "$stage/.github" "$stage/README.md"
            cp out/arch/arm64/boot/Image "$stage/Image"
            cp anykernel/anykernel.sh "$stage/anykernel.sh"
            if [ "$variant" = smooth ]; then
              mkdir -p "$stage/onyx_cpu_limits"
              cp -a tools/onyx_cpu_limits/. "$stage/onyx_cpu_limits/"
              chmod 0755 "$stage/onyx_cpu_limits/service.sh" "$stage/onyx_cpu_limits/uninstall.sh"
              zip_name=ZoroKernel-1.0_smooth_bakasu.zip
            else
              zip_name=ZoroKernel_1.0_performance_bakasu.zip
            fi
            (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/artifacts/$zip_name" .)
          done
          test -s artifacts/ZoroKernel-1.0_smooth_bakasu.zip
          test -s artifacts/ZoroKernel_1.0_performance_bakasu.zip
          unzip -l artifacts/ZoroKernel-1.0_smooth_bakasu.zip | grep -q 'onyx_cpu_limits/service.sh'
          if unzip -l artifacts/ZoroKernel_1.0_performance_bakasu.zip | grep -q 'onyx_cpu_limits/'; then
            echo 'Performance package must not contain CPU caps' >&2
            exit 1
          fi

      - name: Collect build metadata
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f out/.config ]; then cp out/.config artifacts/kernel.config; fi
          kernel_commit=$(git rev-parse HEAD)
          bakasu_commit=$(git -C KernelSU rev-parse HEAD 2>/dev/null || echo unavailable)
          kernel_release=$(make -s O=out ARCH=arm64 LLVM=1 kernelrelease 2>/dev/null || echo unavailable)
          printf '%s\n' "$kernel_commit" > artifacts/kernel-commit.txt
          printf '%s\n' "$bakasu_commit" > artifacts/bakasu-commit.txt
          printf '%s\n' "$ANYKERNEL3_COMMIT" > artifacts/anykernel3-commit.txt
          printf '%s\n' "$SUSFS_VERSION" > artifacts/susfs-version.txt
          printf '%s\n' "$SUSFS_COMMIT" > artifacts/susfs-commit.txt
          cat > artifacts/README.txt <<EOF
          ZoroKernel POCO F7 / Android 17 recovery packages

          Kernel release: $kernel_release
          Kernel source commit: $kernel_commit
          BakaSU commit: $bakasu_commit
          SUSFS: $SUSFS_VERSION ($SUSFS_COMMIT; GKI Android 15 / Linux 6.6 patch)
          Recovery display name: ZoroKernel

          ZoroKernel-1.0_smooth_bakasu.zip includes the fixed CPU maximum
          frequency module: CPUs 0-1 at 1286 MHz, CPUs 2-6 at 1920 MHz,
          CPU 7 at 2515 MHz. It installs into /data/adb/modules during recovery
          flashing. Disable SweetClocker to avoid competing CPU limit settings.

          ZoroKernel_1.0_performance_bakasu.zip has no CPU underclock module.
          Both ZIPs flash the same BakaSU + SUSFS kernel Image.
          EOF

      - name: Upload ZoroKernel recovery packages
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ZoroKernel-Android17-BakaSU-SUSFS
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
