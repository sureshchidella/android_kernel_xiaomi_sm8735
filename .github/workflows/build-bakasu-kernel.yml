name: Build BakaSU kernel

on:
  push:
    branches:
      - lineage-24.0_underclock_bakasu
  workflow_dispatch:
    inputs:
      bakasu_ref:
        description: BakaSU branch, tag, or commit to integrate
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: bakasu-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 kernel with BakaSU
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out kernel source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache flex git libelf-dev \
            libssl-dev make pahole python3 python3-pip rsync

      - name: Install LLVM toolchain
        run: |
          sudo apt-get install -y clang lld llvm
          clang --version

      - name: Fetch and integrate BakaSU
        env:
          BAKASU_REF: ${{ inputs.bakasu_ref || 'main' }}
        run: |
          rm -rf KernelSU
          git clone https://github.com/Baka-SU/BakaSU.git KernelSU
          sh KernelSU/kernel/setup.sh
          git -C KernelSU fetch --depth=1 origin "$BAKASU_REF"
          git -C KernelSU checkout --detach FETCH_HEAD
          test -L drivers/kernelsu

      - name: Configure kernel
        run: |
          scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/gki_defconfig \
            arch/arm64/configs/vendor/pineapple_perf.config
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          scripts/config --file out/.config --enable KSU
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_ARCH_PINEAPPLE=y$' out/.config
          grep -q '^CONFIG_DEVFREQ_GOV_QCOM_ADRENO_TZ=m$' out/.config
          grep -q '^CONFIG_DEVFREQ_GOV_QCOM_GPUBW_MON=m$' out/.config
          grep -q '^CONFIG_SCHED_WALT=m$' out/.config
          grep -E '^(CONFIG_KSU|CONFIG_KSU_)' out/.config

      - name: Build kernel
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 LLVM=1 Image
          test -s out/arch/arm64/boot/Image

      - name: Set up Node.js for the module WebUI
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Package Onyx CPU Profiles module
        run: |
          cd onyx_cpu_profiles/webui
          npm install --no-audit --no-fund --no-package-lock
          npm run build
          cd ../../..
          module_dir="$RUNNER_TEMP/onyx_cpu_profiles"
          rm -rf "$module_dir"
          mkdir -p "$module_dir"
          cp -a onyx_cpu_profiles/. "$module_dir/"
          rm -rf "$module_dir/webroot"
          cp -a onyx_cpu_profiles/webui/webroot-built "$module_dir/webroot"
          rm -rf "$module_dir/webroot-built" "$module_dir/webui"
          chmod 0755 "$module_dir/service.sh" "$module_dir/action.sh" \
            "$module_dir/uninstall.sh" "$module_dir/bin/profile.sh"
          mkdir -p artifacts
          cd "$module_dir"
          zip -r "$GITHUB_WORKSPACE/artifacts/Onyx-CPU-Profiles-BakaSU.zip" .

      - name: Collect build outputs
        if: always()
        run: |
          mkdir -p artifacts
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image artifacts/Image
          fi
          if [ -f out/.config ]; then
            cp out/.config artifacts/kernel.config
          fi
          kernel_commit=$(git rev-parse HEAD)
          bakasu_commit=$(git -C KernelSU rev-parse HEAD 2>/dev/null || echo unavailable)
          kernel_release=$(make -s O=out ARCH=arm64 LLVM=1 kernelrelease 2>/dev/null || echo unavailable)
          printf '%s\n' "$kernel_commit" > artifacts/kernel-commit.txt
          printf '%s\n' "$bakasu_commit" > artifacts/bakasu-commit.txt
          cat > artifacts/README.txt <<EOF
          Onyx LineageOS 24.0 / Android 17 BakaSU CI build

          Kernel release: $kernel_release
          Kernel source commit: $kernel_commit
          BakaSU source commit: $bakasu_commit
          Config: gki_defconfig + vendor/pineapple_perf.config + BakaSU

          Image is a raw kernel build output for CI inspection. It is not a flashable
          boot image or recovery ZIP. Device-matched boot image metadata, ramdisk,
          DTBO, vendor modules, and a reviewed installer are required for flashing.
          EOF

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Onyx-Lineage-24.0-BakaSU-CI
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload BakaSU CPU profiles module
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Onyx-CPU-Profiles-BakaSU
          path: artifacts/Onyx-CPU-Profiles-BakaSU.zip
          if-no-files-found: error
          retention-days: 14
